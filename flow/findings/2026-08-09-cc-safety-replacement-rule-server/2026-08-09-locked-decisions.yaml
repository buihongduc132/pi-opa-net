- id: LD-S5
  turn: turn8
  parts: ["user-mandate", "final-shape"]
  user_quote: |
    "Wait , it is simpler to make our plugins just 1 single hook:
    - load config from central / common place ;
    - eval;
    - allow / gate act ;
    opa-net repository house the rules , we will implement here , Ansible deploy to the ~/.opa-net;
    no complex logic;
    intention of the server is that 1 common place of rules for all cli-agents; it is it , that simple;"
  decision: >
    Minimal single-hook architecture — no daemon, no runtime server. Each client plugin = 1 hook
    (load rules from ~/.opa-net → eval → allow/gate). opa-net repo houses rules; Ansible deploys
    to ~/.opa-net. "Server" = rules directory + Ansible, not a running process.
  status: locked

