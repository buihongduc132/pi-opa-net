# ── Below: from gotcha-coverage step 20 (2026-08-16, 3 reviewer batches) ──
# Appendices: turn8a (architecture), turn4a (gating+parity), turn9a (unlock-keys)

  - id: OT10
    topic: RANK 5 — dual-guard hook shadowing voids parity claim
    raised_in: turn4a-gotcha
    status: open
    severity: 5
    source: gotcha-coverage
    note: |
      Both pi-bash-guard and pi-opa-net register tool_call hooks. If pi-bash-guard fires
      first and passes (e.g. `git commit --no-verify -m x` leak), pi-opa-net's 51 rules are
      bypassed → LD-S1 parity claim VOID. Explains OT3 symptom fully. Must verify pi hook
      execution order (serial vs first-block-wins), then disable/deprioritize pi-bash-guard
      for gated domains. Telemetry to detect shadowing in production.

  - id: OT11
    topic: rule/client version skew → silent under-deny (rego undefined)
    raised_in: turn8a-gotcha
    status: open
    severity: 4
    source: gotcha-coverage
    note: |
      Rules deployed via Ansible, clients via npm — independently versioned, no input-schema
      contract. Old client + new rules: missing input field in rego = undefined → rule
      doesn't fire → ALLOW, no error. Worse than crash. Also: no version handshake between
      extension and bin (wrong exit codes/JSON schema silently misclassified). Mitigation:
      min-client-version in version file; input_schema_v smoke rule; version+exit-code
      contract check.

  - id: OT12
    topic: threat model undefined — client-side guard bypassable by guarded agent
    raised_in: turn8a-gotcha
    status: open
    severity: 4
    source: gotcha-coverage
    note: |
      Agent with bash can rm the rego, point PIOPANET_HOME at empty dir, PATH-shadow an opa
      shim, or edit rego to allow-all. No daemon = no out-of-reach authority. Guard is
      advisory (accident-prevention only). MUST state threat model explicitly in spec; if
      tamper-resistance needed: root-owned ~/.opa-net + signed digest verification.

  - id: OT13
    topic: salt = de-facto god-key; guarded agent can mint keys
    raised_in: turn9a-gotcha
    status: open
    severity: 4
    source: gotcha-coverage
    note: |
      Possession of salt file mints valid keys for EVERY rule (unlock-key CLI has no gate).
      Injected command can mint then re-run denied command. LD-L2 "no god-key" holds for
      format, not material. Under trusted-fleet assumption = acceptable; MUST document
      "salt = root of all keys" + unlock-keys ≠ injection defense. Optionally salt unreadable
      by agent shell (sudo-issued).

  - id: OT14
    topic: salt-path drift — code default ~/.pi-opa-net/salt vs architecture ~/.opa-net/salt
    raised_in: turn9a-gotcha
    status: open
    severity: 4
    source: gotcha-coverage
    note: |
      SaltResolver default = ~/.pi-opa-net/salt; LD-S5/S6 deploy to ~/.opa-net/salt.
      Resolver silently auto-generates divergent salt on mismatch → all fleet-issued keys
      wrong-salt → denies stand, zero error surfaced. "Zero new code" claim FALSE — salt
      path needs config/code change + loud auto-gen warning + Ansible assert.

  - id: OT15
    topic: deploy/discovery correctness — path mismatch, empty-dir, atomicity, -d dir semantics, opa pin
    raised_in: turn4a-gotcha
    status: open
    severity: 4
    source: gotcha-coverage
    note: |
      Cluster: (1) PIOPANET_HOME discovery checks <agentDir>/pi-opa-net/rules, Ansible writes
      ~/.opa-net → silent fallback to bundled rules. (2) existsSync checks dir not .rego
      contents → empty deploy = silent fail-open. (3) file-by-file deploy races readers →
      releases/<ver>/ + symlink flip. (4) opa eval -d <dir> loads EVERY .rego incl. strays →
      fleet fail-mode; use single file/manifest. (5) opa version unpinned → compile drift.

  - id: OT16
    topic: subprocess robustness — no timeout, bun-only spawn, audit races
    raised_in: turn4a-gotcha
    status: open
    severity: 4
    source: gotcha-coverage
    note: |
      spawn lacks timeout → hung eval freezes agent (worse than fail-open). spawn('bun')
      hardcoded → Node-only environments silently skip gating. Audit write not awaited →
      loses records. Mitigation: 5-10s kill timer, runtime detection (bun/node), await or
      documented fire-and-forget, per-call perf budget (opa eval recompiles ~100-500ms;
      precompiled bundle cuts it).

  - id: OT17
    topic: parser is the real TS lock — non-TS clients cannot share rules parity
    raised_in: turn8a-gotcha
    status: open
    severity: 4
    source: gotcha-coverage
    note: |
      OT9 addressed EVAL portability; but PARSER (AST+regex → input JSON) is TS-only in
      common/. Hermes/zcode non-TS runtimes must reimplement → same command parses
      differently → different deny set. Options: move matching logic INTO rego (input = raw
      string), or language-neutral parser spec + conformance vectors all clients must pass.

  - id: OT18
    topic: parity governance — cc-safety-net still maintained + implicit-subcommand migration audit
    raised_in: turn4a-gotcha
    status: open
    severity: 4
    source: gotcha-coverage
    note: |
      "Still maintained" rulebook can drift from rego (no sync). Also: JSON→Rego port loses
      implicit-subcommand semantics (bare `git stash` ≡ push) unless manually added — ported
      rules may be WEAKER than intended. Declare opa-net new source of truth + freeze
      rulebook + audit all ported rules for implicit defaults + test cases for bare commands.

  - id: OT19
    topic: per-client rule scoping + shared config surface undefined
    raised_in: turn8a-gotcha
    status: open
    severity: 3
    source: gotcha-coverage
    note: |
      One deny set for pi/hermes/zcode → pi-specific rules mis-fire on others. Config
      (allowedBranches, worktreeAllowedDirs) is pi-shaped via Config.ts. Mitigation:
      input.client + applicable_clients guard in rego; client-agnostic config schema inside
      ~/.opa-net manifest.

  - id: OT20
    topic: unlock UX/safety gaps — ENV session-lifetime, salt mode stderr-only, fleet revocation best-effort, fail-open-keyless ignores keys silently
    raised_in: turn9a-gotcha
    status: open
    severity: 3
    source: gotcha-coverage
    note: |
      ENV keys persist whole session (scope creep). Salt mode warning → stderr only,
      invisible in agent contexts (Ansible copy defaults 0644). Revocation only reaches
      hosts Ansible touches (clones/unmanaged auto-gen divergent salts). OPA-down + keys
      present → fail-open-keyless, keys silently ignored (user thinks unlock worked).
      Mitigations: TTL-only via ENV, hard-fail bad mode, salt epoch/max-age check, warn on
      fail-open-keyless.

  - id: OT21
    topic: misc moderate — compound-split quoting, tool adapter registry, non-git signals, self-check wiring, digest archive
    raised_in: turn4a-gotcha
    status: open
    severity: 3
    source: gotcha-coverage
    note: |
      (1) raw.split(';') breaks quoted semicolons — use ShellQuote for unquoted-only split.
      (2) PI_SHELL_TOOL_ADAPTERS hardcodes bash/Shell — future tools bypass; make registry
      extensible. (3) signals collected only for git — non-git rules get undefined signals.
      (4) runSelfCheck() exported never called — wire at load or CLI. (5) decisions carry
      digest but no rulebook archive → pre-reconciliation audit unverifiable; archive rulesets
      before OT2 merge (ties OT2).
